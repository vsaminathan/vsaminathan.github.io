<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: 'PageQualis Privacy Policy' }}">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f8fa;
      color: #374151;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 28px 20px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 820px;
      margin: 0 auto;
    }

    .brand {
      color: #111827;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.3px;
    }

    .container {
      max-width: 820px;
      margin: 48px auto;
      padding: 48px 56px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.03);
    }

    main h1 {
      margin: 0 0 8px;
      color: #111827;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1.25;
    }

    .last-updated {
      display: inline-block;
      margin: 8px 0 30px;
      padding: 4px 11px;
      background: #f1f5f9;
      border-radius: 5px;
      color: #64748b;
      font-size: 13px;
      font-weight: 500;
    }

    main h2 {
      margin: 36px 0 12px;
      padding-bottom: 9px;
      border-bottom: 1px solid #e5e7eb;
      color: #1f2937;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.3px;
      line-height: 1.4;
    }

    p {
      margin: 0 0 18px;
    }

    ul{
      margin: 12px 0 22px;
      padding-left: 26px;
    }

    li {
      margin-bottom: 12px;
      padding-left: 3px;
    }

    li::marker {
      color: #94a3b8;
    }

    strong {
      color: #1f2937;
      font-weight: 650;
    }

    a {
      color: #2563eb;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .contact {
      padding: 18px 20px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }

    footer {
      padding: 0 20px 35px;
      color: #94a3b8;
      font-size: 15px;
      text-align: center;
    }

    footer a {
      color: #64748b;
    }

    @media (max-width: 600px) {
      body {
        font-size: 15px;
      }

      header {
        padding: 20px;
      }

      .container {
        margin: 16px 12px 30px;
        padding: 28px 22px;
        border-radius: 9px;
      }

      main h1 {
        font-size: 27px;
      }

      main h2 {
        margin-top: 30px;
        font-size: 19px;
      }

      .last-updated {
        margin-bottom: 24px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="brand">PageQualis</div>
    </div>
  </header>

  <div class="container">
    <main>
      {{ content }}
    </main>
  </div>
</body>
</html>
