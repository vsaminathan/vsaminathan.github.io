<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="48rLorCV4OUP0EBEONwsaqP2WJVkV5yL6dFv8MjSAm4" />
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/images/logo-48.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/logo-16.png">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/documents.css' | relative_url }}">
</head>

<body>
  {% if page.show_logo %}
  <header>
    <div class="header-inner">
      <div class="branding">
        <a href="{{ '/pagequalis/' | relative_url }}">
          <img src="/assets/images/logo-128.png" alt="" class="brand-logo">
          <span class="brand">PageQualis</span>
        </a>
      </div>
    </div>
  </header>
  {% endif %}

  <div class="container">
    <main>
      {{ content }}
    </main>
  </div>
</body>

</html>
